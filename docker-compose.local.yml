services:
  postgres:
    image: postgres:16-alpine
    container_name: yijie-postgres
    environment:
      POSTGRES_USER: yijie
      POSTGRES_PASSWORD: yijie
      POSTGRES_DB: yijie_api
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - yijie_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yijie -d yijie_api"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: yijie-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - yijie_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: yijie-pgvector
    environment:
      POSTGRES_USER: yijie
      POSTGRES_PASSWORD: yijie
      POSTGRES_DB: yijie_knowledge
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - yijie_pgvector_data:/var/lib/postgresql/data
      - ./init/pgvector/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U yijie -d yijie_knowledge &&
          psql -U yijie -d yijie_knowledge -Atc
          "SELECT 1 FROM pg_extension WHERE extname = 'vector'" | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 5

  feat125-keycloak-db:
    profiles: ["feat-125-local"]
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    container_name: yijie-feat125-keycloak-db
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${FEAT125_KEYCLOAK_DB_PASSWORD:-}
      POSTGRES_DB: keycloak
    volumes:
      - yijie_feat125_keycloak_postgres_data:/var/lib/postgresql/data
    networks:
      - feat125_identity_internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  feat125-keycloak:
    profiles: ["feat-125-local"]
    image: quay.io/keycloak/keycloak:26.7.0@sha256:0f198be292568439d700cdbfb893e69a6009bb43a94a06a945b1d3d506c76b13
    container_name: yijie-feat125-keycloak
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: feat125-keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${FEAT125_KEYCLOAK_DB_PASSWORD:-}
      KC_BOOTSTRAP_ADMIN_USERNAME: feat125-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${FEAT125_KEYCLOAK_ADMIN_PASSWORD:-}
      KC_HOSTNAME: https://localhost:8443
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_LOG_LEVEL: info
    depends_on:
      feat125-keycloak-db:
        condition: service_healthy
    volumes:
      - ./config/feat-125-local/keycloak/realm.json:/opt/keycloak/data/import/yijie-local-realm.json:ro
    networks:
      - feat125_identity_internal
      - feat125_proxy_internal
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          { printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
          grep -Eq '^HTTP/1\.[01] 200([[:space:]]|$)'; } 0<>/dev/tcp/127.0.0.1/9000
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  feat125-caddy:
    profiles: ["feat-125-local"]
    image: caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    container_name: yijie-feat125-caddy
    depends_on:
      feat125-keycloak:
        condition: service_healthy
    ports:
      - "127.0.0.1:8443:8443"
      - "127.0.0.1:9443:9443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./config/feat-125-local/Caddyfile:/etc/caddy/Caddyfile:ro
      - yijie_feat125_caddy_data:/data
      - yijie_feat125_caddy_config:/config
    networks:
      - feat125_proxy_internal
      - feat125_host_bridge
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true

volumes:
  yijie_postgres_data:
  yijie_redis_data:
  yijie_pgvector_data:
  yijie_feat125_keycloak_postgres_data:
  yijie_feat125_caddy_data:
  yijie_feat125_caddy_config:

networks:
  feat125_identity_internal:
    internal: true
  feat125_proxy_internal:
    internal: true
  feat125_host_bridge:
